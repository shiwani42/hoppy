<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoppy — health twin (interactive)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --cream:#F8F5EE; --card:#FFFFFF; --ink:#1C1B19; --mute:#8C877E; --line:#EEE9DF; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#E9E5DC; font-family:Inter, system-ui, sans-serif; color:var(--ink); }
  button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; padding:0; }
  .phone { position:relative; width:390px; height:844px; border-radius:44px; overflow:hidden; background:var(--cream); box-shadow:0 30px 80px rgba(60,50,30,.18); }
  .screen { position:absolute; inset:0; transition:transform .45s cubic-bezier(.2,.8,.2,1), opacity .35s; }
  .screen.off-right { transform:translateX(100%); opacity:0; pointer-events:none; }
  .screen.off-left { transform:translateX(-30%); opacity:0; pointer-events:none; }
  .top { display:flex; justify-content:space-between; align-items:center; padding:18px 20px 0; }
  .icon { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .title { font:600 15px Inter; }
  .hello { text-align:center; margin:4px 0 0; font:700 30px/1.1 "Inter Tight"; letter-spacing:-.02em; }
  .muted { color:var(--mute); }
  .big { font:800 64px/1 "Inter Tight"; letter-spacing:-.04em; font-variant-numeric:tabular-nums; }
  .card { background:var(--card); border-radius:28px; box-shadow:0 1px 0 var(--line), 0 10px 30px rgba(60,50,30,.06); }
  .glass { background:rgba(255,255,255,.72); border:1px solid rgba(255,255,255,.95); box-shadow:0 8px 30px rgba(60,50,30,.10), inset 0 1px 0 rgba(255,255,255,.9); backdrop-filter:blur(18px) saturate(1.4); -webkit-backdrop-filter:blur(18px) saturate(1.4); }
  .chip { display:inline-flex; align-items:center; gap:6px; font:500 13px Inter; color:#6c675f; padding:7px 11px; border-radius:999px; background:rgba(28,27,25,.05); }
  .pill { display:inline-flex; align-items:center; gap:8px; padding:7px 13px 7px 7px; border-radius:999px; font:600 14px Inter; font-variant-numeric:tabular-nums; transition:transform .2s; }
  .pill:active { transform:scale(.95); }
  .bubble { display:inline-block; background:var(--card); border-radius:20px 20px 20px 6px; padding:10px 14px; font:500 15px Inter; box-shadow:0 6px 20px rgba(60,50,30,.07); }
  .mine { align-self:flex-end; background:#1C1B19; color:#fff; border-radius:20px 20px 6px 20px; padding:10px 14px; font:500 15px Inter; }
  /* input bar + peeking twin */
  .bar { position:absolute; left:14px; right:14px; bottom:22px; border-radius:30px; padding:12px 12px 10px 18px; z-index:5; }
  .bar input { width:100%; border:0; outline:0; background:transparent; font:400 15px Inter; color:var(--ink); margin-bottom:10px; }
  .bar input::placeholder { color:#a39d92; }
  .tools { display:flex; align-items:center; gap:14px; }
  .send { margin-left:auto; width:34px; height:34px; border-radius:50%; background:#E7E2D8; display:flex; align-items:center; justify-content:center; transition:background .2s; }
  .send.on { background:#1C1B19; }
  .peek { position:absolute; right:24px; bottom:112px; width:76px; height:76px; z-index:4; animation:float 3.6s ease-in-out infinite; cursor:pointer; }
  .suggest { position:absolute; left:14px; right:14px; bottom:132px; display:flex; gap:8px; z-index:4; }
  .menu { position:absolute; left:22px; bottom:112px; z-index:6; width:210px; border-radius:22px; padding:6px; transform-origin:12% 100%; transition:transform .22s cubic-bezier(.2,.9,.3,1.3), opacity .18s; }
  .menu.hidden { transform:scale(.6); opacity:0; pointer-events:none; }
  .menu button { display:flex; width:100%; align-items:center; gap:10px; padding:11px 12px; border-radius:16px; font:500 15px Inter; text-align:left; }
  .menu button:hover { background:rgba(28,27,25,.05); }
  .twin-btn { display:block; margin:22px auto 0; width:170px; height:170px; animation:float 3.6s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-6px) } }
  .tiles { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; margin-top:12px; }
  .tile { display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 6px; border-radius:20px; background:#FBF9F4; font:500 13px Inter; transition:transform .15s, background .15s; }
  .tile:hover { background:#F4F0E6; transform:translateY(-2px); }
  .toast { position:absolute; left:50%; top:62px; transform:translate(-50%,-10px); opacity:0; transition:all .25s; z-index:9; background:#1C1B19; color:#fff; font:500 14px Inter; padding:9px 16px; border-radius:999px; white-space:nowrap; }
  .toast.on { opacity:1; transform:translate(-50%,0); }
  .hint { position:fixed; top:16px; left:50%; transform:translateX(-50%); font:500 13px Inter; color:#6c675f; }
  .thread { position:absolute; left:20px; right:20px; top:70px; bottom:190px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; scrollbar-width:none; }
  .thread::-webkit-scrollbar { display:none; }
</style>
</head>
<body>

<div class="phone" id="phone">
  <div class="toast" id="toast" role="status"></div>

  <!-- ===== HOME ===== -->
  <section class="screen" id="home" aria-label="Home">
    <div class="top">
      <button class="icon" aria-label="This week with family" data-go="family"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1B19" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M15 14.5c3 0 6 2 6 5.5"/></svg></button>
      <span class="title">Hoppy</span>
      <button class="icon" aria-label="Calendar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C1B19" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></button>
    </div>

    <button class="twin-btn" id="twinBtn" aria-label="Your twin. Tap to say hi"><svg width="170" height="170"><use href="#twin"/></svg></button>
    <p class="hello">Good morning, Asha.</p>
    <div style="display:flex; justify-content:center; margin-top:8px"><span class="chip glass" id="streak"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#E8833A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-7 2 1 3 2 3 4"/></svg>12-day streak</span></div>

    <div style="display:flex; justify-content:center; align-items:baseline; gap:8px; margin-top:16px">
      <span class="big" id="vitality">0</span><span class="muted" style="font-size:15px">vitality</span>
      <span style="font:600 14px Inter; color:#4E9A3A; margin-left:4px">↑ 4</span>
    </div>

    <div style="display:flex; justify-content:center; gap:8px; margin-top:20px">
      <button class="pill glass" data-say="protein"><svg width="28" height="28"><use href="#s-dal"/></svg><span id="pProtein">34 g</span></button>
      <button class="pill glass" data-say="water"><svg width="28" height="28"><use href="#s-drop"/></svg><span id="pWater">1.2 L</span></button>
      <button class="pill glass" data-say="move"><svg width="28" height="28"><use href="#s-shoe"/></svg><span id="pMove">19 min</span></button>
    </div>

    <div style="display:flex; align-items:flex-end; justify-content:space-between; padding:20px 22px 0">
      <span class="bubble" id="say" style="max-width:230px">Little fuel. Big plans.</span>
      <button id="tumbler" aria-label="Add a glass of water" style="position:relative; width:62px; height:84px">
        <svg viewBox="0 0 62 84" width="62" height="84" aria-hidden="true">
          <defs><clipPath id="glassClip"><path d="M9 8 H53 L47 76 Q46 80 42 80 H20 Q16 80 15 76 Z"/></clipPath></defs>
          <path d="M5 4 H57 L50 79 Q49 84 43 84 H19 Q13 84 12 79 Z" fill="#fff"/>
          <g clip-path="url(#glassClip)"><rect x="0" y="0" width="62" height="84" fill="#EEF5FC"/><rect id="water" x="0" y="44" width="62" height="40" fill="url(#drop)"/><path id="wave" d="M0 44 q8 -4 15.5 0 t15.5 0 t15.5 0 t15.5 0 V50 H0 Z" fill="#fff" opacity=".35"/></g>
          <path d="M9 8 H53 L47 76 Q46 80 42 80 H20 Q16 80 15 76 Z" fill="none" stroke="#CFE2F6" stroke-width="2"/>
        </svg>
        <span style="position:absolute; right:-6px; top:-6px; width:24px; height:24px; border-radius:50%; background:#1C1B19; color:#fff; font:700 15px/24px Inter; text-align:center">+</span>
      </button>
    </div>
  </section>

  <!-- ===== CHAT / MEAL ===== -->
  <section class="screen off-right" id="chat" aria-label="Today">
    <div class="top">
      <button class="icon" aria-label="Back" data-go="home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C1B19" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <span class="title">Today</span>
      <span style="width:40px"></span>
    </div>
    <div class="thread" id="thread"></div>
  </section>

  <!-- ===== FAMILY ===== -->
  <section class="screen off-right" id="family" aria-label="This week with family">
    <div class="top">
      <button class="icon" aria-label="Back" data-go="home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C1B19" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <span class="title">This week</span>
      <span style="width:40px"></span>
    </div>
    <p class="muted" style="text-align:center; margin:22px 0 0; font-size:14px">Most strong days wins</p>
    <div style="display:flex; justify-content:center; align-items:flex-end; gap:14px; margin-top:26px; height:290px">
      <div class="podium" data-h="110" data-n="4" style="text-align:center">
        <svg width="84" height="84"><use href="#twin"/></svg>
        <div class="card col" style="width:96px; height:0; margin-top:-6px; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:24px; overflow:hidden">
          <span class="big num" style="font-size:40px">0</span><span class="muted" style="font-size:12px">You</span>
        </div>
      </div>
      <div class="podium" data-h="150" data-n="5" style="text-align:center">
        <svg width="96" height="96"><use href="#twin-papa"/></svg>
        <div class="card col" style="width:104px; height:0; margin-top:-6px; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:24px; background:#FFF6D6; overflow:hidden">
          <span class="big num" style="font-size:52px">0</span><span class="muted" style="font-size:12px">Papa</span>
        </div>
      </div>
      <div class="podium" data-h="84" data-n="3" style="text-align:center">
        <svg width="78" height="78"><use href="#twin-meera"/></svg>
        <div class="card col" style="width:92px; height:0; margin-top:-6px; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:24px; overflow:hidden">
          <span class="big num" style="font-size:34px">0</span><span class="muted" style="font-size:12px">Meera</span>
        </div>
      </div>
    </div>
    <div class="card" style="margin:22px 20px 0; padding:18px">
      <div id="week" style="display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:6px; justify-items:center; height:36px"></div>
      <p style="margin:12px 0 0; text-align:center; font:500 15px Inter">One more than last week.</p>
    </div>
    <div style="display:flex; gap:10px; padding:18px 20px 0">
      <button class="glass" id="cheer" style="flex:1; height:50px; border-radius:999px; font:600 15px Inter">Cheer Papa</button>
      <button id="shareWeek" style="flex:1; height:50px; border-radius:999px; font:600 15px Inter; background:#1C1B19; color:#fff">Share my week</button>
    </div>
  </section>

  <!-- ===== shared input bar ===== -->
  <div class="suggest" id="suggest">
    <button class="chip glass" data-ask="How much protein today?">How much protein?</button>
    <button class="chip glass" data-ask="Can I have chai?">Can I have chai?</button>
  </div>
  <button class="peek" id="peek" aria-label="Your twin"><svg width="76" height="76"><use href="#twin"/></svg></button>
  <div class="menu glass hidden" id="menu" role="menu">
    <button role="menuitem" data-log="photo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1B19" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Take a photo</button>
    <button role="menuitem" data-log="library"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1B19" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 16l5-5 4 4 3-3 4 4"/></svg>Photo library</button>
    <button role="menuitem" data-log="sample"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1B19" stroke-width="2" stroke-linecap="round"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M16 3c-2 2-2 6 0 8v10"/></svg>Try a sample meal</button>
  </div>
  <form class="bar glass" id="bar">
    <input id="ask" placeholder="Ask about your day" aria-label="Ask about your day" autocomplete="off">
    <div class="tools">
      <button type="button" id="logBtn" aria-label="Log a meal" aria-haspopup="menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6c675f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
      <button type="button" id="micBtn" aria-label="Speak a meal"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6c675f" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <span class="chip"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6c675f" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="3"/></svg>Today</span>
      <button class="send" id="send" aria-label="Send"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
    </div>
  </form>
</div>

<script>
const $ = (s) => document.querySelector(s);
const state = { protein: 34, water: 1.2, move: 19, vitality: 72, screen: 'home' };
const ease = 'cubic-bezier(.2,.9,.3,1.25)';

function countUp(el, to, { from = 0, dur = 900, fmt = (v) => Math.round(v) } = {}) {
  const t0 = performance.now();
  const tick = (t) => {
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(from + (to - from) * e);
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function typeOut(el, text, cps = 38) {
  return new Promise((res) => {
    let i = 0; el.textContent = '';
    const iv = setInterval(() => { el.textContent = text.slice(0, ++i); if (i >= text.length) { clearInterval(iv); res(); } }, 1000 / cps);
  });
}
function hop(el) { el.animate([{ transform: 'translateY(0) scale(1)' }, { transform: 'translateY(-14px) scale(1.06,.95)' }, { transform: 'translateY(0) scale(.96,1.04)' }, { transform: 'translateY(0) scale(1)' }], { duration: 600, easing: 'ease-out' }); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1800); }

// ---- navigation ----
function go(id) {
  if (id === state.screen) return;
  const from = $('#' + state.screen), to = $('#' + id);
  const forward = id !== 'home';
  from.classList.add(forward ? 'off-left' : 'off-right');
  to.classList.remove('off-right', 'off-left');
  state.screen = id;
  $('#suggest').style.display = id === 'family' ? 'none' : 'flex';
  $('#bar').style.display = $('#peek').style.display = id === 'family' ? 'none' : '';
  if (id === 'family') enterFamily();
}
document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => go(b.dataset.go)));

// ---- home: twin reacts, vitality counts up, pills explain themselves ----
const LINES = ['Little fuel. Big plans.', 'Hi! I feel lighter this week.', 'Water first, then the world.', 'A walk after lunch? I’m in.'];
let li = 0;
$("#twinBtn").addEventListener('click', () => { hop($("#twinBtn svg")); li = (li + 1) % LINES.length; typeOut($('#say'), LINES[li]); });
$('#peek').addEventListener('click', () => hop($('#peek svg')));
const PILL = { protein: () => `${60 - state.protein > 0 ? 60 - state.protein + ' g protein to go.' : 'Protein goal done!'}`, water: () => 'Two more glasses and I’m glowing.', move: () => '11 minutes of walking left today.' };
document.querySelectorAll('[data-say]').forEach((b) => b.addEventListener('click', () => { hop(b); typeOut($('#say'), PILL[b.dataset.say]()); }));
countUp($('#vitality'), state.vitality, { dur: 1200 });

// ---- water tumbler: each tap adds a glass and the water rises ----
const WATER_TARGET = 2.25;
function setWater(animate) {
  const f = Math.min(1, state.water / WATER_TARGET), y = 84 - f * 76;
  const w = $('#water'), wave = $('#wave');
  if (animate) { w.animate([{ y: w.getAttribute('y') }, { y }], { duration: 600, easing: ease }); }
  w.setAttribute('y', y); w.setAttribute('height', 84 - y);
  wave.setAttribute('d', `M0 ${y} q8 -4 15.5 0 t15.5 0 t15.5 0 t15.5 0 V${y + 6} H0 Z`);
}
setWater(false);
$('#tumbler').addEventListener('click', () => {
  const before = state.water;
  state.water = Math.round((state.water + 0.25) * 100) / 100;
  setWater(true); hop($('#tumbler'));
  countUp($('#pWater'), state.water, { from: before, dur: 500, fmt: (v) => v.toFixed(1) + ' L' });
  typeOut($('#say'), state.water >= WATER_TARGET ? 'Tumbler full. I’m glowing!' : ['Ahh, refreshing.', 'One more sip for me?', 'Hydration level: rising.'][Math.floor(state.water * 4) % 3]);
});

// ---- logging a meal (Zest-style): menu → photo → "For lunch?" → card ----
const menu = $('#menu');
$('#logBtn').addEventListener('click', (e) => { e.stopPropagation(); menu.classList.toggle('hidden'); });
document.addEventListener('click', (e) => { if (!menu.contains(e.target)) menu.classList.add('hidden'); });
menu.querySelectorAll('[data-log]').forEach((b) => b.addEventListener('click', () => { menu.classList.add('hidden'); logSample(); }));
$('#micBtn').addEventListener('click', () => { go('chat'); addMine('2 roti, dal, thodi bhindi'); setTimeout(askWhen, 500); });

const thread = $('#thread');
function add(html, cls = '') {
  const d = document.createElement('div'); d.className = cls; d.innerHTML = html; thread.appendChild(d);
  d.animate([{ opacity: 0, transform: 'translateY(16px) scale(.97)' }, { opacity: 1, transform: 'none' }], { duration: 380, easing: ease });
  thread.scrollTo({ top: thread.scrollHeight, behavior: 'smooth' });
  return d;
}
function addMine(text) { add(`<span>${text}</span>`, 'mine'); }
const PHOTO = `<div style="display:flex; justify-content:flex-end"><div class="photo" style="width:160px; height:160px; border-radius:26px; background:#2B2620; transform:rotate(3deg); box-shadow:0 14px 30px rgba(60,50,30,.18); display:flex; align-items:center; justify-content:center"><svg viewBox="0 0 120 120" width="140" height="140" role="img" aria-label="Your photo: dal, roti and bhindi"><circle cx="60" cy="60" r="56" fill="#F3EEE4"/><circle cx="60" cy="60" r="46" fill="#FBF8F2"/><use href="#s-roti" x="18" y="26" width="46" height="46"/><use href="#s-roti" x="26" y="36" width="42" height="42"/><use href="#s-dal" x="58" y="22" width="48" height="48"/><ellipse cx="72" cy="86" rx="20" ry="9" fill="#6E9F45"/><ellipse cx="66" cy="84" rx="7" ry="2.5" fill="#9CCB6E"/><ellipse cx="78" cy="88" rx="7" ry="2.5" fill="#9CCB6E"/></svg></div></div>`;
function logSample() {
  go('chat');
  const p = add(PHOTO);
  p.querySelector('.photo').animate([{ transform: 'rotate(18deg) translateY(-40px) scale(.6)', opacity: 0 }, { transform: 'rotate(3deg)', opacity: 1 }], { duration: 520, easing: ease });
  setTimeout(askWhen, 650);
}
function askWhen() {
  const c = add(`<p style="margin:0; font:600 17px Inter">For lunch?</p><div class="tiles">
    <button class="tile" data-m="breakfast"><svg width="44" height="44"><use href="#s-chai"/></svg>Breakfast</button>
    <button class="tile" data-m="lunch"><svg width="44" height="44"><use href="#s-dal"/></svg>Lunch</button>
    <button class="tile" data-m="snack"><svg width="44" height="44"><use href="#s-leaf"/></svg>Snack</button>
    <button class="tile" data-m="dinner"><svg width="44" height="44"><use href="#s-roti"/></svg>Dinner</button></div>`, 'card');
  c.style.padding = '18px';
  c.querySelectorAll('.tile').forEach((t, i) => t.animate([{ opacity: 0, transform: 'scale(.7)' }, { opacity: 1, transform: 'none' }], { duration: 320, delay: 80 * i, easing: ease, fill: 'backwards' }));
  c.querySelectorAll('.tile').forEach((t) => t.addEventListener('click', () => mealCard(c, t.textContent.trim())));
}
async function mealCard(picker, meal) {
  picker.animate([{ opacity: 1 }, { opacity: 0, transform: 'scale(.96)' }], { duration: 200 }).onfinish = () => picker.remove();
  await new Promise((r) => setTimeout(r, 220));
  const c = add(`<div style="display:flex; gap:14px; align-items:center"><svg width="56" height="56"><use href="#s-dal"/></svg>
    <div><p class="muted" style="margin:0; font-size:13px">${meal} · dal, roti &amp; bhindi</p><p class="big kcal" style="margin:2px 0 0; font-size:56px">0</p><p class="muted" style="margin:2px 0 0; font-size:12px">kcal · estimated</p></div></div>
    <p class="line" style="margin:14px 0 0; font:500 16px Inter; min-height:22px"></p>
    <div class="chips" style="display:flex; gap:8px; margin-top:12px"></div>`, 'card');
  c.style.padding = '20px';
  countUp(c.querySelector('.kcal'), 520, { from: 180, dur: 1000 });
  await new Promise((r) => setTimeout(r, 700));
  await typeOut(c.querySelector('.line'), 'Protein-packed. Your twin approves.');
  for (const [i, txt] of ['+22 g protein', '+9 g fibre'].entries()) {
    const s = document.createElement('span'); s.className = 'chip'; s.textContent = txt; c.querySelector('.chips').appendChild(s);
    s.animate([{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'none' }], { duration: 300, delay: i * 120, easing: ease, fill: 'backwards' });
  }
  hop($('#peek svg'));
  state.protein += 22;
  countUp($('#pProtein'), state.protein, { from: state.protein - 22, fmt: (v) => Math.round(v) + ' g' });
  state.vitality += 1; $('#vitality').textContent = state.vitality;
}

// ---- asking: streamed answers with one big number ----
const ANSWERS = [
  { re: /protein/i, big: () => `${state.protein} <span style="font-size:18px">g</span>`, sticker: 's-dal', line: () => (state.protein >= 60 ? 'Goal done. Muscles say thank you.' : `Almost there. ${60 - state.protein} g to go.`) },
  { re: /chai|tea/i, big: () => '90 <span style="font-size:18px">kcal</span>', sticker: 's-chai', line: () => 'Yes! One cup fits easily. Less sugar, more love.' },
  { re: /water|paani/i, big: () => `${state.water} <span style="font-size:18px">L</span>`, sticker: 's-drop', line: () => 'Two more glasses and I’m glowing.' },
];
async function answer(q) {
  go('chat'); addMine(q);
  const a = ANSWERS.find((x) => x.re.test(q)) ?? { big: () => '72', sticker: 's-sun', line: () => 'Ask me about protein, water, chai — anything from today.' };
  await new Promise((r) => setTimeout(r, 450));
  const c = add(`<div style="display:flex; align-items:center; gap:14px"><svg width="48" height="48"><use href="#${a.sticker}"/></svg>
    <div><p class="big" style="margin:0; font-size:40px">${a.big()}</p><p class="muted line" style="margin:2px 0 0; font-size:14px; min-height:18px"></p></div></div>`, 'card');
  c.style.padding = '16px 18px';
  await typeOut(c.querySelector('.line'), a.line());
}
const input = $('#ask'), send = $('#send');
input.addEventListener('input', () => { send.classList.toggle('on', !!input.value.trim()); if (input.value.length === 1) hop($('#peek svg')); });
$('#bar').addEventListener('submit', (e) => { e.preventDefault(); const q = input.value.trim(); if (!q) return; input.value = ''; send.classList.remove('on'); answer(q); });
document.querySelectorAll('[data-ask]').forEach((b) => b.addEventListener('click', () => answer(b.dataset.ask)));

// ---- family: podium rises, the week's leaves pop in ----
function enterFamily() {
  document.querySelectorAll('.podium').forEach((p, i) => {
    const col = p.querySelector('.col'), n = p.querySelector('.num');
    col.animate([{ height: '0px' }, { height: p.dataset.h + 'px' }], { duration: 700, delay: 150 + i * 120, easing: ease, fill: 'forwards' });
    setTimeout(() => countUp(n, Number(p.dataset.n), { dur: 600 }), 300 + i * 120);
    p.querySelector('svg').animate([{ transform: 'translateY(30px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 500, delay: 150 + i * 120, easing: ease, fill: 'backwards' });
  });
  const week = $('#week'); week.innerHTML = '';
  [1, 1, 0, 1, 1, 0, -1].forEach((v, i) => {
    const el = document.createElement('div');
    el.innerHTML = v > 0 ? '<svg width="34" height="34"><use href="#s-leaf"/></svg>' : `<span style="display:block; width:30px; height:30px; border-radius:50%; margin-top:2px; ${v < 0 ? 'border:2px dashed #D9D2C4' : 'background:#F1ECE2'}"></span>`;
    week.appendChild(el);
    el.animate([{ opacity: 0, transform: 'scale(.4) rotate(-20deg)' }, { opacity: 1, transform: 'none' }], { duration: 380, delay: 700 + i * 90, easing: ease, fill: 'backwards' });
  });
}
$('#cheer').addEventListener('click', (e) => {
  const b = e.currentTarget; b.textContent = 'Cheered'; hop(b);
  for (let i = 0; i < 8; i++) {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('width', 26); s.setAttribute('height', 26);
    s.innerHTML = `<use href="#${['s-leaf', 's-sun', 's-drop'][i % 3]}"/>`; s.style.cssText = 'position:absolute; left:50%; top:50%; pointer-events:none';
    b.parentElement.style.position = 'relative'; b.parentElement.appendChild(s);
    const a = (i / 8) * Math.PI * 2;
    s.animate([{ transform: 'translate(-50%,-50%) scale(.3)', opacity: 1 }, { transform: `translate(${Math.cos(a) * 90 - 13}px, ${Math.sin(a) * 60 - 13}px) scale(1)`, opacity: 0 }], { duration: 800, easing: 'ease-out' }).onfinish = () => s.remove();
  }
  toast('Papa will see your cheer');
});
$('#shareWeek').addEventListener('click', () => toast('Your week card is ready to share'));
</script>
</body>
</html>
